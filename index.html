<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
/* тема: Telegram (colorScheme) > ?theme=dark|light > системная. Светлая по умолчанию. */
(function(){
  var r=document.documentElement, W=window.Telegram&&window.Telegram.WebApp, tg=(W&&W.initData)?W:null, mq=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)'), q='';
  try{q=new URLSearchParams(location.search).get('theme')||''}catch(e){}
  function apply(){
    var d = q==='dark'||q==='light' ? q==='dark' : tg ? tg.colorScheme==='dark' : !!(mq&&mq.matches);
    r.setAttribute('data-theme', d?'dark':'light');
    try{ if(W&&W.setHeaderColor){ W.setHeaderColor(d?'#0a0d2e':'#ffd9bf'); W.setBackgroundColor(d?'#0a0d2e':'#faf7ff'); } }catch(e){}
  }
  apply();
  try{ if(mq&&mq.addEventListener) mq.addEventListener('change',apply); }catch(e){}
  try{ if(tg&&tg.onEvent) tg.onEvent('themeChanged',apply); }catch(e){}
})();
</script>
<style>

--vio:#f6ecd6;--acc:#e0bd72;--onacc:#1a1450;--gold:#e0bd72;--goldt:#e0bd72;--sage:#a9c3a5;--sage-bg:rgba(169,195,165,.1);--peach:#ffc9a8;--peach-bg:rgba(255,201,168,.09);--lav:#b9a6e8;--lav-bg:rgba(185,166,232,.1);

--c0:#9d90e8;--c1:#ff7a8a;--c2:#5cb8e6;--c3:#f5b942;--c4:#5fd08a;--c5:#c58cf0;--c6:#4fd6d6;--c7:#e8955a;--c8:#ff7ab8;--c9:#b3d65a;--c10:#7fb2e5;--c11:#aab2b9;--c12:#e08a8a;--c13:#5fd0b6;--c14:#e0a86a;--c15:#d98fd4}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bgimg) no-repeat top/100% 980px,var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden;min-height:100vh}
:root[data-theme="dark"] body{background:var(--bgimg) fixed,var(--bg)}
#stars{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;display:none}
:root[data-theme="dark"] #stars{display:block}
.tw{animation:tw 4s ease-in-out infinite}@keyframes tw{50%{opacity:.25}}
.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:0 16px 24px}
h1,h2,h3{font-family:var(--serif)}
h1{font-size:22px;margin:0}h3{font-size:14px;margin:0 0 8px;letter-spacing:.16em;text-transform:uppercase;color:var(--goldt);font-weight:700}

@media(min-width:860px){.hero{padding:30px 0 14px}.hero-in{flex-direction:row;justify-content:center;gap:60px;text-align:left}.hero-text{text-align:left;align-items:flex-start}.ringbox{width:280px;height:280px}.pc{font-size:90px}.btns{justify-content:flex-start}}
.hero-text{display:flex;flex-direction:column;align-items:center;position:relative}

.btn.ghost{background:transparent;color:var(--goldt);border-color:var(--gold);box-shadow:none}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}

:root[data-theme="dark"] .w .c{background:linear-gradient(rgba(27,20,89,.85),rgba(27,20,89,.85)) padding-box,linear-gradient(135deg,var(--gold),#7a5f26) border-box;box-shadow:0 0 14px rgba(224,189,114,.25)}

.tw{overflow-x:auto}
footer{margin:10px 0 10px;text-align:center}
.kd{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}

.tt i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}

/* ---------- график: масштаб, прокрутка, подсказка по касанию ---------- */
const DOW=['вс','пн','вт','ср','чт','пт','сб'];

/* cfg: n, start (ГГГГ-ММ-ДД первой точки), series [{name,color,w,dash,get(i)}], scales [[дней,подпись]], scale, center, sel, onOpen(i), title(i,b), bucket(P) */
function zchart(box,cfg){
  const st=box._z||(box._z={}); 
  if(!cfg.scales.some(z=>z[0]===st.scale)) st.scale=cfg.scale;

  };
  const idx=e=>{const r=s.getBoundingClientRect(); return Math.floor((e.clientX-r.left)/pw)};
  ov.addEventListener('pointermove',e=>{if(e.pointerType==='mouse') show(idx(e))});

/* Данные: 1) встроены в файл (локальный дашборд); 2) data.enc рядом со страницей, расшифровка ключом из #k=… (GitHub Pages);
   3) /api/forecast (локальный просмотр через бот/webapp.py). Ключ из адреса никуда не отправляется. */
function b64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/'); const b=atob(s+'==='.slice((s.length+3)%4)); return Uint8Array.from(b,c=>c.charCodeAt(0))}
function getKey(){
  let k=null;
  try{ k=new URLSearchParams(location.hash.replace(/^#/,'')).get('k'); }catch(e){}
  try{ if(k) localStorage.setItem('astro_k',k); else k=localStorage.getItem('astro_k'); }catch(e){}
  return k;
}
async function inflate(buf){
  if(typeof DecompressionStream==='function'){
    const ds=new Blob([buf]).stream().pipeThrough(new DecompressionStream('deflate'));
    return new Uint8Array(await new Response(ds).arrayBuffer());
  }
  await new Promise((ok,bad)=>{const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js'; s.onload=ok; s.onerror=bad; document.head.append(s)});
  return window.pako.inflate(new Uint8Array(buf));
}
async function decryptBlob(buf,keyStr){
  const u=new Uint8Array(buf);
  if(String.fromCharCode(...u.slice(0,4))!=='AST1') throw new Error('Файл данных повреждён.');
  const key=await crypto.subtle.importKey('raw', b64u(keyStr), 'AES-GCM', false, ['decrypt']);
  let pt; try{ pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:u.slice(4,16), additionalData:u.slice(0,4)}, key, u.slice(16)); }
  catch(e){ try{localStorage.removeItem('astro_k')}catch(_){} throw new Error('Не удалось расшифровать: неверный ключ. Откройте приложение кнопкой из чата с ботом.'); }
  return JSON.parse(new TextDecoder().decode(await inflate(pt)));
}
async function loadData(){
  const t=$('data').textContent.trim();
  if(t && t!=='null') return JSON.parse(t);
  const k=getKey();
  if(k){
    const r=await fetch('data.enc?t='+Date.now(),{cache:'no-store'});
    if(r.ok) return decryptBlob(await r.arrayBuffer(), k);
  }
  const h={}; if(TG && TG.initData) h['X-Telegram-Init-Data']=TG.initData;
  const r=await fetch('/api/forecast',{headers:h,cache:'no-store'}).catch(()=>null);
  if(r && r.ok) return r.json();
  throw new Error(k?'Не удалось загрузить данные. Попробуйте позже.':'Нет ключа. Откройте приложение кнопкой «Открыть прогноз» из чата с ботом.');
}

/* ---------- маршрутизатор (хэш-маршруты, история браузера, кнопка «назад» Telegram) ---------- */
const view=()=>$('view');
let curKey=null; const scrollMap={};
function depth(){return (history.state&&history.state.n)||0}
function go(path){history.pushState({n:depth()+1},'','#/'+path); route(true)}
function back(){ if(depth()>0) history.back(); else {history.replaceState({n:0},'','#/'); route(false)} }
function parseRoute(){const h=location.hash||''; if(!h.startsWith('#/')) return []; return h.slice(2).split('&')[0].split('/').filter(Boolean).map(decodeURIComponent)}
function link(path,node){node.href='#/'+path; node.addEventListener('click',e=>{if(e.metaKey||e.ctrlKey)return; e.preventDefault(); go(path)}); return node}
function toast(t){let b=$('toast'); if(!b){b=el('div'); b.id='toast'; document.body.append(b)} b.textContent=t; b.hidden=false; clearTimeout(b._t); b._t=setTimeout(()=>{b.hidden=true},4500)}

  if(TG && D.bot && TG.openTelegramLink){
    try{ TG.openTelegramLink('https://t.me/'+D.bot+'?start='+code); setTimeout(()=>{try{TG.close()}catch(e){}},200); return }catch(e){}
  }

function route(isPush){
  if(!D) return;
  if(curKey!==null) scrollMap[curKey]=window.scrollY;
  const r=parseRoute(), key=r.join('/'), v=view(); v.textContent=''; curKey=key;
  const home=!r.length;
  $('backbtn').hidden=home;
  if(TG&&TG.BackButton){try{home?TG.BackButton.hide():TG.BackButton.show()}catch(e){}}
  try{
    if(home) pageHome();
    else if(r[0]==='day') pageDay(r[1]);
    else if(r[0]==='theme') pageTheme(r[1]);
    else if(r[0]==='period') pagePeriod(r[1]);
    else if(r[0]==='year') pageYear(+r[1]);
    else if(SIMPLE[r[0]]) SIMPLE[r[0]]();
    else {history.replaceState({n:0},'','#/'); curKey=''; pageHome()}
  }catch(e){v.append(el('div','err','Ошибка отображения: '+(e.message||e)))}
  window.scrollTo(0,isPush?0:(scrollMap[key]||0));
}

function pickDays(th,reverse,n){
  const arr=D.days.slice(0,91).map((x,i)=>[x.date,x.themes[th],i]).sort((a,b)=>reverse?a[1]-b[1]:b[1]-a[1]);
  const got=[]; for(const c of arr){ if(got.every(g=>Math.abs(g[2]-c[2])>2)) got.push(c); if(got.length===n) break }
  return got.sort((a,b)=>a[2]-b[2]);
}

    const b=el('button','chip'+(n===flt?' on':''),n); b.type='button';
    b.onclick=()=>{flt=n;renderChips();renderPeriods()}; c.append(b);
  });
}
function renderPeriods(){
  const g=$('periodsgrid'); g.textContent='';
  const list=D.periods.filter(p=>flt==='Все'||p.spheres.includes(flt));
  if(!list.length){g.append(el('div','mute','Нет периодов по этой сфере.'));return}
  list.forEach(p=>{
    const c=link('period/'+p.id,el('a','card pc2 plink'));
    const top=el('div','top'); const ic=el('div','ico '+(p.tone==='гарм'?'g':'o'), p.tone==='гарм'?'+':'!');
    ic.title = p.tone==='гарм'?'благоприятный период':'период требует внимания';
    const ttl=el('div'); ttl.append(el('b',null,p.title)); top.append(ic,ttl); c.append(top);
    const tags=el('div'); p.spheres.forEach(s=>tags.append(el('span','tag',s))); c.append(tags);
    c.append(el('div',null,p.text));
    c.append(el('div','small','Период: '+p.start_ru+' — '+p.end_ru));
    if(p.touches_ru.length) c.append(el('div','small mute','Точные касания: '+p.touches_ru.join(', ')));
    let st = p.active ? 'ещё '+p.days_left+' '+plural(p.days_left) : 'начнётся через '+p.days_to_start+' '+plural(p.days_to_start);
    c.append(el('div','small '+(p.tone==='гарм'?'pos':'neg'), st+' · подробнее →'));
    g.append(c);
  });
}
function pageHalf(){
  const v=view(); v.append(pageHead(D.days_shown+' '+plural(D.days_shown),'Итог дня, фон и темы'));
  v.firstChild.append(cond());
  v.insertAdjacentHTML('beforeend',`<div class="card"><h3>Итог дня и фон периода</h3><div class="chips" id="lchips"></div><div class="lbox" id="lbox"></div><div class="mute small">Кнопки меняют масштаб, график прокручивается пальцем. Коснитесь графика: сверху появятся дата и значения всех включённых линий.</div></div>
  <div class="cols" style="margin-top:14px"><div class="card"><h3>Календарь: цвет — итог дня</h3><div class="heat" id="heat"></div></div><div class="card"><h3>Ключевые даты</h3><div id="kd"></div></div></div>
  <div class="card" style="margin-top:14px"><h3>Средние проценты по месяцам</h3><div class="chips" id="mchips"></div><div id="mbub"></div></div>`);
  renderLChips(); sel=0; renderLine(true); renderHeat(); renderMonths(); renderKD();
}
let sphIdx=0;
function pageSpheres(){
  const v=view(); v.append(pageHead('Сферы жизни'));
  const nav=el('div','chips'); const pv=el('button','chip','←'), nx=el('button','chip','→'), lb=el('span','chip on'); pv.type=nx.type='button'; nav.append(pv,lb,nx); v.append(nav);
  v.insertAdjacentHTML('beforeend','<div class="spheres" id="spheres"></div><div class="card" style="margin-top:14px"><h3>Диаграмма</h3><div id="radar"></div></div>');
  const draw=()=>{
    const x=D.days[sphIdx]; lb.textContent=x.weekday_short+', '+x.date_ru;
    const sp=$('spheres'); sp.textContent='';
    D.spheres.forEach(n=>{
      const vv=x.spheres[n], c=el('div','sph'), r=el('div','ring'); r.style.background=`conic-gradient(${col(vv)} ${vv*3.6}deg, var(--track) 0)`; r.append(el('span',null,vv+'%'));
      c.append(r,el('div',null,n)); const why=(x.sphere_why[n]||[]).slice(0,2).map(w=>w[0]).join('; '); if(why) c.append(el('div','mute small',why)); sp.append(c);
    });
    renderRadar(x);
  };
  pv.onclick=()=>{sphIdx=Math.max(0,sphIdx-1);draw()}; nx.onclick=()=>{sphIdx=Math.min(D.days.length-1,sphIdx+1);draw()};
  lb.style.cursor='pointer'; lb.onclick=()=>go('day/'+D.days[sphIdx].date); draw();
}
function pageSolar(){

}

function pagePast(){

  <div class="cols" style="margin-top:14px"><div class="card"><h3>Средний итог по годам</h3><div id="pyears"></div></div><div class="card" id="p2007"></div></div>
  <div class="cols" style="margin-top:14px"><div class="card sage"><h3>5 лучших периодов прошлого</h3><div id="pbest"></div></div><div class="card peach"><h3>5 самых тихих периодов прошлого</h3><div id="pworst"></div></div></div>
  <div class="mute small" style="margin-top:8px">Периоды — окна по 3 месяца. Сверьте с памятью: совпадает ли расчёт с тем, как вы жили.</div>`);

/* ---------- лучшие периоды: недели / годы ---------- */
let bestMode='weeks';
function pageBest(){
  const v=view(); v.append(pageHead('Лучшие периоды впереди')); v.firstChild.append(cond());
  const seg=el('div','seg'); [['weeks','Недели'],['years','Годы']].forEach(([k,t])=>{const b=el('button','chip'+(bestMode===k?' on':''),t); b.type='button'; b.onclick=()=>{bestMode=k; v.textContent=''; pageBest()}; seg.append(b)}); v.append(seg);
  if(bestMode==='years') return bestYears(v);
  v.insertAdjacentHTML('beforeend',`<div class="card" id="lifebox"></div>
  <div class="cols" style="margin-top:14px"><div class="card"><h3>10 лучших недель до 2036 года</h3><div id="bweeks"></div></div>
  <div class="card"><h3>Заработок: 5 лучших недель на год вперёд</h3><div id="bmoney"></div><h3 style="margin-top:14px">Долги и кредиты: 5 лучших недель на год вперёд</h3><div id="bdebts"></div></div></div>
  <div class="mute small" style="margin-top:8px" id="bnote"></div>`);
  renderBest();
}
function bestYears(v){
  const Y=D.best.years||[]; if(!Y.length){v.append(el('div','mute','Нет данных.')); return}
  const c=el('div','card'); c.append(el('h3',null,'Средний итог года, '+Y[0].y+'–'+Y[Y.length-1].y));
  const cols=el('div','ycols'); Y.forEach(y=>{const k=link('year/'+y.y,el('a','yc'+(y.top?' top':''))); const i=el('i'); i.style.height=Math.max(3,y.avg*1.05)+'px'; i.style.background=col(y.avg); k.append(el('b',null,String(Math.round(y.avg))),i,el('span',null,String(y.y).slice(2))); cols.append(k)});
  c.append(cols,el('div','small mute','Золотая рамка — три лучших года. Процент — среднее дневных процентов шкалы 2005–2070 за год. Нажмите на год.')); v.append(c);
  const l=el('div','card'); l.style.marginTop='12px';
  Y.forEach(y=>{
    const r=link('year/'+y.y,el('a','yrow plink')); r.append(el('div','yy',String(y.y)));
    const m=el('div','ym'); m.append(el('b',null,(y.top?'★ ':'')+y.word));
    y.transits.slice(0,2).forEach(t=>m.append(el('div','tr small '+(t.tone==='гарм'?'pos':'neg'),(t.tone==='гарм'?'+ ':'− ')+t.label)));
    const p=el('div','yp',Math.round(y.avg)+'%'); p.style.color=col(y.avg); r.append(m,p); l.append(r);
  });
  v.append(l); v.append(Object.assign(el('div','mute small','Годы считаются по натальной модели; транзиты в карточках — самые весомые медленные за год. Условная модель: проверка на вашей жизни пока не нашла надёжной связи.'),{style:'margin-top:8px'}));
}
const MN=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
function pageYear(yr){
  const y=(D.best.years||[]).find(q=>q.y===yr), v=view();
  if(!y){v.append(el('div','err','Этого года нет в списке.')); return}
  v.append(pageHead(String(y.y)+' год',y.word+' · в среднем '+Math.round(y.avg)+'%')); v.firstChild.append(cond());
  // график помесячный: «дата» — 1-е число каждого месяца (шаг 30 дней), метки — месяцы
  const c0=el('div','card'); c0.append(el('h3',null,'Итог по месяцам'));
  const bars=el('div','ycols'); y.months.forEach((m,i)=>{const k=el('div','yc'+(y.best_months.includes(i)?' top':'')); const b=el('i'); b.style.height=Math.max(3,m*1.05)+'px'; b.style.background=col(m); k.append(el('b',null,String(m)),b,el('span',null,MN[i])); bars.append(k)});
  c0.append(bars,el('div','small mute','Золотая рамка — три лучших месяца: '+y.best_months.map(i=>MN[i]).join(', ')+'.')); v.append(c0);
  const names=Object.keys(y.tmonths);
  if(names.length){
    const c1=el('div','card'); c1.style.marginTop='12px'; c1.append(el('h3',null,'Темы по месяцам'));
    names.forEach(n=>{
      c1.append(el('div','grp',n)); const bs=el('div','ycols'); bs.style.height='90px';
      y.tmonths[n].forEach((m,i)=>{const k=el('div','yc'); const b=el('i'); b.style.height=Math.max(3,m*.7)+'px'; b.style.background=col(m); k.append(el('b',null,String(m)),b,el('span',null,MN[i])); bs.append(k)});
      c1.append(bs);
    });
    c1.append(el('div','small mute','Помесячные графики есть только для тем, по которым в кэше шкалы есть многолетний ряд (Заработок, Долги и кредиты). Остальные темы считаются на 6 месяцев вперёд на их страницах.')); v.append(c1);
  }
  const c2=el('div','card'); c2.style.marginTop='12px'; c2.append(el('h3',null,'Главные транзиты года'));
  y.transits.forEach(t=>c2.append(el('div','tr '+(t.tone==='гарм'?'pos':'neg'),(t.tone==='гарм'?'+ ':'− ')+t.label))); v.append(c2);
  const prev=D.best.years.find(q=>q.y===yr-1), next=D.best.years.find(q=>q.y===yr+1);
  const nv=el('div','chips'); nv.style.marginTop='12px'; if(prev) nv.append(link('year/'+prev.y,el('a','chip','← '+prev.y))); if(next) nv.append(link('year/'+next.y,el('a','chip',next.y+' →'))); v.append(nv);
}

function init(data){
  D=data; AREAS=D.spheres.concat(D.theme_names);
  document.title='Прогноз: '+D.who;
  $('who').textContent='☾ Прогноз · '+D.who;
  const d0=D.days[0]; $('today').textContent=d0.weekday+', '+d0.date_ru;
  decorStars();
  $('backbtn').onclick=back;
  if(TG&&TG.BackButton){try{TG.BackButton.onClick(back)}catch(e){}}
  const tt=$('totop'); tt.onclick=()=>window.scrollTo({top:0,behavior:'smooth'}); window.addEventListener('scroll',()=>tt.classList.toggle('on',window.scrollY>900),{passive:true});
  window.addEventListener('popstate',()=>route(false));
  if(!(location.hash||'').startsWith('#/')){ try{ history.replaceState({n:0},'',location.pathname+location.search+'#/') }catch(e){} }
  route(false);
  let rz; window.addEventListener('resize',()=>{clearTimeout(rz); rz=setTimeout(()=>{const r=parseRoute(); if(r[0]==='half'||r[0]==='theme'||r[0]==='period'||r[0]==='past'||r[0]==='diary'){const y=scrollY; route(false); scrollTo(0,y)}},250)});
  $('foot').textContent='Сгенерировано: '+D.generated+' · расчёт: Swiss Ephemeris';
}
applyTelegramTheme();
loadData().then(init).catch(e=>{const d=el('div','err',String(e.message||e)); document.querySelector('.wrap').prepend(d)});
</script>
